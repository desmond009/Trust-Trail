name: trusttrail

x-service-app: &service-app
  build: ./services
  # svc-keys holds each service's declaration-signing key (generated on first use).
  volumes: ["./services:/app", "./config:/config:ro", "svc-keys:/keys"]
  depends_on:
    keycloak: {condition: service_healthy}
    trusttrail: {condition: service_started}

services:
  keycloak:
    build: ./keycloak            # stock 26.8.1 + strip-sid mapper jar
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      # Browsers reach Keycloak on localhost:8080, containers on keycloak:8080.
      # Fixed frontend URL keeps the token issuer identical for both;
      # dynamic backchannel lets containers use the internal name for token/JWKS calls.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports: ["8080:8080"]
    volumes: ["kc-data:/opt/keycloak/data"]
    healthcheck:
      # The image has no curl; talk HTTP to the management port by hand.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 40

  # Local Ethereum chain for anchoring (Hardhat 3). In-memory: a restart gives
  # a fresh chain, chain-deploy redeploys, and TrustTrail re-anchors from entry 1.
  chain:
    build: ./chain
    ports: ["8545:8545"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8545',{method:'POST',headers:{'content-type':'application/json'},body:'{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_chainId\",\"params\":[]}'}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40

  chain-deploy:
    build: ./chain
    command: ["npx", "hardhat", "run", "scripts/deploy.ts", "--network", "chainNode"]
    environment: {CHAIN_RPC_URL: "http://chain:8545"}
    volumes: ["./chain/deployments:/app/deployments"]
    depends_on:
      chain: {condition: service_healthy}
    restart: "no"

  trusttrail:
    build: ./trusttrail
    env_file: .env
    environment:
      KC_INTERNAL_URL: http://keycloak:8080
      KC_PUBLIC_URL: http://localhost:8080
      # Anchoring target. Defaults: local Hardhat chain. For Sepolia set these in .env (see README).
      CHAIN_RPC_URL: ${CHAIN_RPC_URL:-http://chain:8545}
      ANCHOR_DEPLOYMENT: /deployments/${ANCHOR_NETWORK:-localhost}.json
      ANCHOR_PRIVATE_KEY: ${ANCHOR_PRIVATE_KEY}
      ANCHOR_INTERVAL_SECONDS: ${ANCHOR_INTERVAL_SECONDS:-}
    ports: ["8000:8000"]
    # Code mounted so edits to scripts/tests apply without a rebuild.
    volumes: ["./trusttrail:/app", "./config:/config:ro", "tt-data:/data", "./chain/deployments:/deployments:ro"]
    depends_on:
      keycloak: {condition: service_healthy}
      chain-deploy: {condition: service_completed_successfully}

  library:
    <<: *service-app
    environment: {SERVICE_ID: library, PORT: "8001", CLIENT_SECRET: "${LIBRARY_CLIENT_SECRET}", SESSION_SECRET: "${SESSION_SECRET}"}
    ports: ["8001:8001"]

  lms:
    <<: *service-app
    environment: {SERVICE_ID: lms, PORT: "8002", CLIENT_SECRET: "${LMS_CLIENT_SECRET}", SESSION_SECRET: "${SESSION_SECRET}"}
    ports: ["8002:8002"]

  exam:
    <<: *service-app
    environment: {SERVICE_ID: exam, PORT: "8003", CLIENT_SECRET: "${EXAM_CLIENT_SECRET}", SESSION_SECRET: "${SESSION_SECRET}"}
    ports: ["8003:8003"]

volumes:
  kc-data:
  tt-data:
  svc-keys:
